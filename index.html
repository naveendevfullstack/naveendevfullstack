<html lang="en" data-theme="dark">

    <meta name="theme-color" content="#070B14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F8FC" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Naveen M. — Flutter Developer" />
    <meta property="og:description" content="Mobile & web applications built with Flutter, Dart, clean architecture, and thoughtful UI." />

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
